name: Apply Prompt Lab Accessibility Update

on:
  push:
    branches: [main]
    paths:
      - 'notebooklm/ACCESSIBILITY_APPLY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply shell patch
        run: node notebooklm/scripts/apply-accessibility-shell.mjs

      - name: Run checks
        working-directory: notebooklm
        run: npm run check

      - name: Commit generated shell changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm/index.html notebooklm/service-worker.js
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Wire accessibility features into Prompt Lab'
          git push origin HEAD:main
