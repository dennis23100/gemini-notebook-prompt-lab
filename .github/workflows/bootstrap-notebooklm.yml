# Triggered via a normal GitHub merge so the bootstrap can run with the latest workflow definition.
name: Bootstrap NotebookLM Prompt Lab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-notebooklm.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: toolkit-60-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/toolkit60-payload.b64
          base64 --decode /tmp/toolkit60-payload.b64 > /tmp/toolkit60-payload.tar.xz
          echo "b398e4019a44b8af2437f3174a786663df81bb54abb7838bc13838f3c0093d86  /tmp/toolkit60-payload.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/toolkit60-payload.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/pages.yml .github/workflows/validate.yml

      - name: Validate NotebookLM project
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run project checks
        working-directory: notebooklm
        run: npm run check

      - name: Commit verified project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged .github/workflows/bootstrap-notebooklm.yml || true
          git restore .github/workflows/bootstrap-notebooklm.yml || true
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Publish NotebookLM Prompt Lab"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
