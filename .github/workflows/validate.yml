name: Validate Gemini Notebook Prompt Lab

on:
  push:
    branches: [main]
    paths:
      - 'notebooklm/**'
      - 'docs/showcase/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'notebooklm/**'
      - 'docs/showcase/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooklm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and test Prompt Lab
        working-directory: notebooklm
        run: npm run check

      - name: Verify README gallery JPEG fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          INPUT="notebooklm/docs/real-output-gallery.webp"
          OUTPUT="${RUNNER_TEMP}/real-output-gallery.jpg"
          INPUT="$INPUT" OUTPUT="$OUTPUT" python3 - <<'PY'
          import os
          from PIL import Image

          src = os.environ['INPUT']
          dst = os.environ['OUTPUT']
          with Image.open(src) as image:
              image.convert('RGB').save(dst, 'JPEG', quality=88, optimize=True, progressive=True)
          PY
          test -s "$OUTPUT"
          file "$OUTPUT"

      - name: Prepare reproducible showcase cases
        working-directory: notebooklm
        run: |
          set -euo pipefail
          npm run showcase:export
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('../docs/showcase/generated-prompts/cases.json', 'utf8'));
          if (!Array.isArray(manifest.cases) || manifest.cases.length !== 9) {
            throw new Error(`Expected 9 showcase cases; got ${manifest.cases?.length ?? 'invalid manifest'}`);
          }
          const ids = new Set(manifest.cases.map(item => item.promptId));
          if (ids.size !== 9) throw new Error('Showcase prompt IDs are not unique');
          console.log('Showcase manifest validated: 9 unique cases.');
          NODE
