name: Validate Gemini Notebook Prompt Lab

on:
  push:
    branches: [main]
    paths:
      - 'notebooklm/**'
      - 'docs/showcase/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'notebooklm/**'
      - 'docs/showcase/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooklm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and test Prompt Lab
        working-directory: notebooklm
        run: npm run check

      - name: Decode real-output preview images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('notebooklm/assets/real-previews')
          names = [
              'comic-sprite.jpg',
              'stars-sprite.jpg',
              'fairy-animation-sprite.jpg',
          ]
          for name in names:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing preview asset: {path}')
              if path.stat().st_size < 20_000:
                  raise SystemExit(f'Preview asset suspiciously small: {path} ({path.stat().st_size} bytes)')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
                  if width < 900 or height < 160:
                      raise SystemExit(f'Preview asset too small: {path} ({width}x{height})')
                  print(f'OK {name}: {width}x{height}, {path.stat().st_size} bytes')
          PY

      - name: Prepare reproducible showcase cases
        working-directory: notebooklm
        run: |
          set -euo pipefail
          npm run showcase:export
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('../docs/showcase/generated-prompts/cases.json', 'utf8'));
          if (!Array.isArray(manifest.cases) || manifest.cases.length !== 9) {
            throw new Error(`Expected 9 showcase cases; got ${manifest.cases?.length ?? 'invalid manifest'}`);
          }
          const ids = new Set(manifest.cases.map(item => item.promptId));
          if (ids.size !== 9) throw new Error('Showcase prompt IDs are not unique');
          console.log('Showcase manifest validated: 9 unique cases.');
          NODE
