name: Rebuild real-output preview assets

on:
  push:
    branches: [fix/individual-real-previews]
    paths:
      - '.preview-b64/**'
      - '.github/workflows/rebuild-preview-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/individual-real-previews
          fetch-depth: 0

      - name: Rebuild when all chunks exist
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            comic-sprite.part01 comic-sprite.part02 comic-sprite.part03 comic-sprite.part04 comic-sprite.part05
            stars-sprite.part01 stars-sprite.part02 stars-sprite.part03
            fairy-animation-sprite.part01 fairy-animation-sprite.part02 fairy-animation-sprite.part03 fairy-animation-sprite.part04
          )
          for f in "${expected[@]}"; do
            [[ -f ".preview-b64/$f" ]] || { echo "Waiting for $f"; exit 0; }
          done

          mkdir -p notebooklm/assets/real-previews
          cat .preview-b64/comic-sprite.part* | base64 -d > notebooklm/assets/real-previews/comic-sprite.jpg
          cat .preview-b64/stars-sprite.part* | base64 -d > notebooklm/assets/real-previews/stars-sprite.jpg
          cat .preview-b64/fairy-animation-sprite.part* | base64 -d > notebooklm/assets/real-previews/fairy-animation-sprite.jpg

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('comic-sprite.jpg','stars-sprite.jpg','fairy-animation-sprite.jpg'):
              p=Path('notebooklm/assets/real-previews')/name
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  print(name, im.size, p.stat().st_size)
                  assert im.width == 1080 and im.height == 201
                  assert p.stat().st_size > 40_000
          PY

          if git diff --quiet -- notebooklm/assets/real-previews/*.jpg; then
            echo 'Preview JPEGs already match; nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm/assets/real-previews/*.jpg
          git commit -m 'fix(previews): replace corrupted JPEG assets'
          git push origin HEAD:fix/individual-real-previews
