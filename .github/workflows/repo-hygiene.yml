name: Repository Hygiene

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.xml'
      - '**/*.cff'
      - '**/*.webmanifest'
      - '.github/workflows/repo-hygiene.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.xml'
      - '**/*.cff'
      - '**/*.webmanifest'
      - '.github/workflows/repo-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale-link-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject stale pre-rename links
        working-directory: notebooklm
        run: node scripts/check-repo-refs.mjs
