name: Deploy Gemini Notebook Prompt Lab

on:
  push:
    branches: [main]
    paths:
      - 'notebooklm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Prompt Lab
        working-directory: notebooklm
        run: npm run check

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's README image proxy has been inconsistent with the source WebP
          # gallery. Generate a JPEG copy for README embeds while keeping the WebP
          # source asset in the repository.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          GALLERY_IN="notebooklm/docs/real-output-gallery.webp"
          GALLERY_OUT="notebooklm/docs/real-output-gallery.jpg"
          convert "$GALLERY_IN" -quality 88 "$GALLERY_OUT"

          rm -rf dist
          mkdir -p dist

          # The repository now focuses on Gemini Notebook Prompt Lab, so the
          # live app is published at the Pages root. Keep /notebooklm/ as a
          # compatibility copy for previously shared links.
          cp -R notebooklm/. dist/
          mkdir -p dist/notebooklm
          cp -R notebooklm/. dist/notebooklm/
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
