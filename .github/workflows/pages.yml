name: Deploy Gemini Notebook Prompt Lab

on:
  push:
    branches: [main]
    paths:
      - 'notebooklm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Prompt Lab
        working-directory: notebooklm
        run: npm run check

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Publish the app at the Pages root and keep /notebooklm/ as a
          # compatibility copy for previously shared links.
          cp -R notebooklm/. dist/
          mkdir -p dist/notebooklm
          cp -R notebooklm/. dist/notebooklm/
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
