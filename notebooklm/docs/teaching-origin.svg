<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">Real-world teaching origin</title><desc id="d">Illustrated card explaining that the project grew from an in-person teaching context with more than 100 attendees.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f6ff"/><stop offset="1" stop-color="#eefaf7"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#675fe8"/><stop offset="1" stop-color="#42bfa3"/></linearGradient></defs>
<rect width="1400" height="520" rx="36" fill="url(#bg)"/><circle cx="1250" cy="80" r="210" fill="#675fe8" opacity=".07"/><circle cx="1180" cy="455" r="190" fill="#42bfa3" opacity=".08"/>
<g transform="translate(70 72)"><rect width="520" height="340" rx="28" fill="#fff" stroke="#dfe4f0"/><rect x="28" y="28" width="464" height="230" rx="18" fill="#171d31"/><rect x="52" y="54" width="170" height="22" rx="11" fill="#7e79f2"/><rect x="52" y="92" width="350" height="12" rx="6" fill="#58647b"/><rect x="52" y="118" width="270" height="12" rx="6" fill="#4a566b"/><rect x="52" y="162" width="118" height="70" rx="14" fill="#232d43"/><rect x="184" y="162" width="118" height="70" rx="14" fill="#232d43"/><rect x="316" y="162" width="148" height="70" rx="14" fill="#232d43"/>
<g fill="#738097"><circle cx="95" cy="300" r="18"/><circle cx="145" cy="300" r="18"/><circle cx="195" cy="300" r="18"/><circle cx="245" cy="300" r="18"/><circle cx="295" cy="300" r="18"/><circle cx="345" cy="300" r="18"/><circle cx="395" cy="300" r="18"/><circle cx="445" cy="300" r="18"/></g><rect x="72" y="318" width="400" height="8" rx="4" fill="#d9deea"/></g>
<g transform="translate(650 86)" font-family="Inter,Arial,sans-serif"><text x="0" y="34" font-size="18" font-weight="800" fill="#15977f" letter-spacing="2">REAL-WORLD ORIGIN</text><text x="0" y="100" font-size="48" font-weight="850" fill="#1d2538">Built from a real</text><text x="0" y="158" font-size="48" font-weight="850" fill="#1d2538">teaching problem.</text><text x="0" y="216" font-size="24" fill="#66738a">The project is informed by an in-person teaching session</text><text x="0" y="252" font-size="24" fill="#66738a">with 100+ attendees and a recurring question:</text><text x="0" y="310" font-size="26" font-weight="750" fill="#353e55">How should the same trusted source change</text><text x="0" y="348" font-size="26" font-weight="750" fill="#353e55">when the audience changes?</text><rect x="0" y="384" width="420" height="54" rx="16" fill="url(#g)"/><text x="24" y="419" font-size="20" font-weight="800" fill="#fff">Source accuracy × audience adaptation</text></g>
</svg>